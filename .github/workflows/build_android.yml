name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        # 👇 تم تغيير الإصدار هنا إلى الأحدث لحل مشكلة Dart
        flutter-version: '3.35.0' 
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    # --- الخطوة الجديدة لفك تشفير مفتاح التوقيع ---
    - name: Decode Keystore and Create key.properties
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
        echo "storeFile=release.keystore" > android/key.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: fattball-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk