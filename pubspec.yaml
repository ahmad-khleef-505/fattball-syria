name: fattball
description: حجز ملاعب كرة القدم في سوريا
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  cupertino_icons: ^1.0.8
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.4
  flutter_riverpod: ^2.6.1
  intl: ^0.19.0
  timezone: ^0.9.4
  image_picker: ^1.1.2
  cloud_functions: ^5.1.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  url_launcher: ^6.3.0
  fl_chart: ^0.69.0
  http: ^1.2.2
add_2_calendar: ^3.0.1
share_plus: ^10.1.2
shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

# هذا القسم يمنع تعارض vector_math
dependency_overrides:
  vector_math: ^2.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/data/
    - assets/sounds/