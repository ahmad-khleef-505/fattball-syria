name: fattball
description: حجز ملاعب كرة القدم في سوريا
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.5.1
  cupertino_icons: ^1.0.8
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  firebase_messaging: ^15.2.5
  firebase_storage: ^12.4.5
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  timezone: ^0.10.0
  image_picker: ^1.2.4
  cloud_functions: ^5.6.2
  google_fonts: ^8.2.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  url_launcher: ^6.3.3
  fl_chart: ^1.3.0
  http: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/data/
    - assets/sounds/
